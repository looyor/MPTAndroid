name: Build MPT Android APK

# 在 GitHub 免费 runner 上构建 APK（无需本机 Android Studio）。
# 用法：把本工程推到 GitHub 仓库后，Actions 页手动 Run workflow；产物在 Artifacts 下载。
# 注意：推送 main 会自动触发构建（无需手动点按钮）。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整拉取（不要用 fetch-depth:1）。通过 Git Data API 推送后触发构建时，
          # 浅克隆可能拉到尚未传播到副本的旧 main 顶端，导致打出的 APK 是旧代码。
          # 完整克隆可确保构建使用推送后的最新源码。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (含 NDK 27)
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;34.0.0
            platforms;android-34
            ndk;27.0.12077973

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Python 3.11 (供 Chaquopy buildPython 在构建机跑 pip)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build debug APK (Gradle 8.9)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpt-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
