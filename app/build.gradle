apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.mpt.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mpt.android'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.4.2'

        ndk {
            abiFilters 'arm64-v8a'
        }
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 关键：让 jniLibs 里的 libffmpeg.so 在安装时被释放到 nativeLibraryDir
    // （可执行目录）。Android 10+ 禁止执行应用私有数据目录里的二进制，
    // 只有 nativeLibraryDir 里的 .so 才能被 exec，否则 ffmpeg 会报
    // [Errno 13] Permission denied。
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // 不要把 libffmpeg.so 当普通 .so 去 strip/改坏，原样保留可执行文件。
            keepDebugSymbols.add("**/libffmpeg.so")
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.11"

        pip {
            // 轻量后端（light edition）只依赖以下纯 Python 包，均可在
            // Chaquopy(Android aarch64) 正常安装，彻底规避 pydantic-core 等
            // 无法在安卓编译的 Rust 扩展（FastAPI/uvicorn/edge_tts/moviepy 已移除）。
            // 视频合成直接使用 assets 内置的 ffmpeg，字幕用 PIL 渲染。
            install "requests==2.32.3"
            install "gtts==2.5.4"
            install "pillow"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
