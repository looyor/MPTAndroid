apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.mpt.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mpt.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.3.9'

        ndk {
            abiFilters 'arm64-v8a'
        }
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.11"

        pip {
            // imageio-ffmpeg 在 PyPI 只发布平台专用 wheel（无 py3-none-any / 无 Android 轮子），
            // Chaquopy 为 aarch64 目标无法解析，故改为仓库内本地 wheel（已构建为通用 py3-none-any）。
            // 运行时由 IMAGEIO_FFMPEG_EXE 指向 assets 内置 ffmpeg，不会调用其自带的下载逻辑。
            install "vendor/imageio_ffmpeg-0.6.0-py3-none-any.whl"
            install "fastapi==0.136.3"
            install "uvicorn==0.32.1"
            install "starlette==1.2.1"
            install "edge_tts==7.3.1"
            install "openai==1.39.0"
            install "google-genai==2.11.0"
            install "dashscope==1.20.14"
            install "moviepy==2.2.1"
            install "toml==0.10.2"
            install "loguru==0.7.3"
            install "pyyaml==6.0.3"
            install "requests==2.33.1"
            install "pydub==0.25.1"
            install "python-multipart==0.0.27"
            install "packaging==24.2"
            install "socksio==1.0.0"
            install "redis==5.2.0"
            install "numpy"
            install "pillow"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
